    <script>
      // The UI uses opacity steps outside Tailwind's default scale (e.g. bg-white/12);

        theme: {
          extend: {
            opacity: {
              12: '0.12', 16: '0.16', 38: '0.38', 45: '0.45', 55: '0.55', 65: '0.65',
              68: '0.68', 72: '0.72', 78: '0.78', 82: '0.82', 85: '0.85', 88: '0.88'
            }
          }
        }
      };
